name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.arch }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, x86_32, arm64]
        config: [Debug, Release]
        include:
          - arch: x86_64
            cmake_arch: x64
          - arch: x86_32
            cmake_arch: Win32
          - arch: arm64
            cmake_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Scoop
        uses: MinoruSekine/setup-scoop@v4
        with:
          apps: vulkan

      - name: Get godot-cpp commit hash
        id: godot-cpp-hash
        shell: bash
        run: echo "hash=$(git -C lib/godot-cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache godot-cpp build
        uses: actions/cache@v5
        with:
          path: build/lib/godot-cpp
          key: godot-cpp-${{ steps.godot-cpp-hash.outputs.hash }}-${{ matrix.arch }}-${{ matrix.config }}

      - name: Configure CMake
        run: >
          cmake -B build
          -A ${{ matrix.cmake_arch }}
          -DCMAKE_BUILD_TYPE=${{ matrix.config }}
          -DGODOT_SPOUT_ENABLE_VULKAN=ON
          -DGODOT_SPOUT_ENABLE_OPENGL=ON

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Install
        run: cmake --install build --config ${{ matrix.config }}

      - name: Get DLL filename
        id: dll-name
        shell: bash
        run: |
          config_lower=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
          echo "name=libgodot-spout.windows.${config_lower}.${{ matrix.arch }}.dll" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v7
        with:
          name: dll-${{ matrix.arch }}-${{ matrix.config }}
          path: demo/addons/godot-spout/bin/${{ steps.dll-name.outputs.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download all artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release package
        run: |
          mkdir -p release/addons/godot-spout/bin
          cp artifacts/*.dll release/addons/godot-spout/bin/
          cp demo/addons/godot-spout/godot-spout.gdextension release/addons/godot-spout/
          cp demo/addons/godot-spout/godot-spout.gdextension.uid release/addons/godot-spout/
          cd release
          zip -r ../godot-spout-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          files: godot-spout-${{ github.ref_name }}.zip
          generate_release_notes: true
