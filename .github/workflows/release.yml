name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.arch }}, ${{ matrix.config }})
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, x86_32]
        config: [Debug, Release]
        include:
          - arch: x86_64
            cmake_arch: x64
          - arch: x86_32
            cmake_arch: Win32

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install SCons
        run: pip install scons

      - name: Get godot-cpp commit hash
        id: godot-cpp-hash
        shell: bash
        run: echo "hash=$(git -C lib/godot-cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache godot-cpp build
        uses: actions/cache@v4
        with:
          path: lib/godot-cpp/bin
          key: godot-cpp-${{ steps.godot-cpp-hash.outputs.hash }}-${{ matrix.arch }}-${{ matrix.config }}

      - name: Configure CMake
        run: cmake -B build -A ${{ matrix.cmake_arch }}

      - name: Build
        run: cmake --build build --config ${{ matrix.config }}

      - name: Install
        run: cmake --install build --config ${{ matrix.config }}

      - name: Get DLL filename
        id: dll-name
        shell: bash
        run: |
          config_lower=$(echo "${{ matrix.config }}" | tr '[:upper:]' '[:lower:]')
          echo "name=libgodot-spout.windows.${config_lower}.${{ matrix.arch }}.dll" >> $GITHUB_OUTPUT

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: dll-${{ matrix.arch }}-${{ matrix.config }}
          path: demo/addons/godot-spout/bin/${{ steps.dll-name.outputs.name }}

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: Prepare release package
        run: |
          mkdir -p release/addons/godot-spout/bin
          cp artifacts/*.dll release/addons/godot-spout/bin/
          cp demo/addons/godot-spout/godot-spout.gdextension release/addons/godot-spout/
          cp demo/addons/godot-spout/godot-spout.gdextension.uid release/addons/godot-spout/
          cd release
          zip -r ../godot-spout-${{ github.ref_name }}.zip .

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: godot-spout-${{ github.ref_name }}.zip
          generate_release_notes: true
