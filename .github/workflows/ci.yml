name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.arch }}, ${{ matrix.config }}, all options)
    runs-on: windows-latest
    strategy:
      matrix:
        arch: [x86_64, arm64]
        config: [Debug]
        include:
          - arch: x86_64
            cmake_arch: x64
          - arch: arm64
            cmake_arch: ARM64

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: Set up Scoop
        uses: MinoruSekine/setup-scoop@v4
        with:
          apps: vulkan

      - name: Locate Vulkan SDK
        id: vulkan-sdk
        shell: pwsh
        run: |
          $vulkanRoot = (scoop prefix vulkan).Trim()
          $vulkanInclude = Join-Path $vulkanRoot "Include"
          $vulkanLibrary = Join-Path $vulkanRoot "Lib/vulkan-1.lib"
          "VULKAN_SDK=$vulkanRoot" >> $env:GITHUB_ENV
          "Vulkan_INCLUDE_DIR=$vulkanInclude" >> $env:GITHUB_OUTPUT
          "Vulkan_LIBRARY=$vulkanLibrary" >> $env:GITHUB_OUTPUT

      - name: Get godot-cpp commit hash
        id: godot-cpp-hash
        shell: bash
        run: echo "hash=$(git -C lib/godot-cpp rev-parse HEAD)" >> $GITHUB_OUTPUT

      - name: Cache CMake build
        uses: actions/cache@v5
        with:
          path: build
          key: ci-build-scoop-vulkan-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.config }}-${{ steps.godot-cpp-hash.outputs.hash }}-${{ hashFiles('CMakeLists.txt', 'src/**', 'lib/SpoutVulkan/**', 'lib/Spout2/**/CMakeLists.txt') }}
          restore-keys: |
            ci-build-scoop-vulkan-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.config }}-${{ steps.godot-cpp-hash.outputs.hash }}-
            ci-build-scoop-vulkan-${{ runner.os }}-${{ matrix.arch }}-${{ matrix.config }}-

      - name: Configure CMake
        shell: pwsh
        run: |
          cmake -B build `
            -A ${{ matrix.cmake_arch }} `
            -DCMAKE_BUILD_TYPE=${{ matrix.config }} `
            -DGODOT_SPOUT_ENABLE_VULKAN=ON `
            -DGODOT_SPOUT_ENABLE_OPENGL=ON `
            -DVulkan_INCLUDE_DIR="${{ steps.vulkan-sdk.outputs.Vulkan_INCLUDE_DIR }}" `
            -DVulkan_LIBRARY="${{ steps.vulkan-sdk.outputs.Vulkan_LIBRARY }}"

      - name: Build
        run: cmake --build build --config ${{ matrix.config }} --target GodotSpout
